# Options specific to sensor placement
sensor_placement:
  strategy: "greedy"
  number_of_sensors: 25
  target_nodes: []
  update_method: "nearest"

# Options specific to uncertainty application
# Uncertainty is spread between model uncertainty (parametric and topological) and
# measurement uncertainty (sensor errors)


# Options specific to leak localization methods
# Note: the names of the methods must correspond to the names registered by the software
leak_localization_options:
  DifferentialPressureLeakLocator: []
  DifferentialTimePressureLeakLocator: []
  GraphStateLeakLocator: []
  StyxLeakLocator : []
