[metadata]
name = hydroforge
author = "Tomasz Janus"
author_email = tomasz.k.janus@gmail.com
description = Toolkit for applying uncertainties to water network models
url = https://github.com/tomjanus/HydroForge
project_urls =
    Bug Tracker = https://github.com/tomjanus/HydroForge/issues
    Documentation = https://github.com/tomjanus/HydroForge
    Source Code = https://github.com/tomjanus/HydroForge
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Hydrology
    Topic :: Software Development :: Libraries :: Python Modules
license = GPL-3.0
license_files = LICENSE
include_package_data = True
zip_safe = False

[options]
package_dir =
    = src
python_requires = >=3.10

[options.packages.find]
where = src
include = hydroforge*
exclude =
    tests*
    cython*

[options.extras_require]
cython =
    Cython>=0.29.0
numba =
    numba>=0.56.0
dev =
    pytest>=6.0
    pytest-cov
    black
    flake8
    mypy
    Cython>=0.29.0
    numba>=0.56.0
all =
    Cython>=0.29.0
    numba>=0.56.0
    pytest>=6.0
    pytest-cov
    black
    flake8
    mypy

[options.entry_points]
console_scripts =
    hydroforge= hydroforge.cli:main

[options.package_data]
hydroforge =
    *.yaml
    *.yml
    *.inp
    *.json
    *.csv

[build_ext]
include_dirs = numpy.get_include()

[bdist_wheel]
universal = 0

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --verbose
    --tb=short
    --strict-markers

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
source = src/hydroforge
omit =
    */tests/*
    */test_*
    setup.py
    */cython/*
    */scenario_generation_pyfavor/*
    */scenario_generation_tsnet/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod