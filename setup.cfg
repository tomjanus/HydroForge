[metadata]
name = hydroforge
author = "Tomasz Janus"
author_email = tomasz.k.janus@gmail.com
description = Toolkit for applying uncertainties to water network models

classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Hydrology
    Topic :: Software Development :: Libraries :: Python Modules

include_package_data = True
zip_safe = False

[options]
package_dir =
    = src
python_requires = >=3.10

[options.packages.find]
where = src
include = hydroforge*
exclude =
    tests*
    cython*


console_scripts =
    hydroforge= hydroforge.cli:main

[options.package_data]
hydroforge =
    *.yaml
    *.yml
    *.inp
    *.json
    *.csv

[build_ext]
include_dirs = numpy.get_include()

[bdist_wheel]
universal = 0

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --verbose
    --tb=short
    --strict-markers

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
source = src/hydroforge
omit =
    */tests/*
    */test_*
    setup.py
    */cython/*
    */scenario_generation_pyfavor/*
    */scenario_generation_tsnet/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod