name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 --config=.flake8 .

      - name: Type check with mypy
        run: mypy .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest==8.3.4" "pytest-cov==6.0.0"

      - name: Run tests with pytest
        run: pytest

  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build source distribution and wheel
        run: |
          python -m build

      - name: Verify distribution metadata
        run: python tests/packaging/check_distribution_metadata.py dist

      - name: Verify package can be installed
        run: |
          target_dir="$RUNNER_TEMP/hydroforge-wheel-install"
          python -m pip install --no-deps --target "$target_dir" dist/*.whl
          PYTHONPATH="$target_dir" python -c "import hydroforge; print(hydroforge.__version__)"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build --sdist --wheel
          twine upload dist/*